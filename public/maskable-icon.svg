<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mask-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6" />
      <stop offset="100%" stop-color="#1d2d5a" />
    </linearGradient>
    <linearGradient id="mask-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d68f" />
      <stop offset="100%" stop-color="#007d55" />
    </linearGradient>
  </defs>
  <!-- Full bleed background for Android adaptive icon cropping -->
  <rect width="512" height="512" fill="url(#mask-grad)" />
  
  <!-- Safe zone contained content (within 80% circle) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />
    
    <!-- Graduation Cap -->
    <path d="M256 120 L390 190 L256 260 L122 190 Z" fill="#ffffff" />
    <path d="M360 215 V295 C360 305 350 315 340 315 C330 315 320 305 320 295 V235" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <circle cx="340" cy="325" r="10" fill="url(#mask-accent)" />
    
    <!-- Open Book / Academic Shield Below -->
    <path d="M165 240 L256 288 L347 240 V340 C347 365 256 405 256 405 C256 405 165 365 165 340 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M256 295 V395" stroke="#004ac6" stroke-width="6" stroke-linecap="round" />
    
    <!-- Checkmark -->
    <path d="M210 330 L242 360 L305 305" fill="none" stroke="url(#mask-accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
